<!DOCTYPE html>
<html lang="en" data-theme="doom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --surface: #1A0808;
      --accent-primary: #FF3333;
      --accent-primary-dim: #660000;
      --accent-secondary: #FF8800;
      --accent-tertiary: #FFD700;
      --text: #E8D5D5;
      --text-muted: #805A5A;
      --glow-red: 0 0 20px rgba(255, 51, 51, 0.3);
      --glow-orange: 0 0 20px rgba(255, 136, 0, 0.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Scanlines overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* CRT vignette */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 99;
    }

    .container {
      position: relative; z-index: 1;
      text-align: center;
      max-width: 700px;
      padding: 2rem;
    }

    /* HUD header */
    .hud {
      background: var(--surface);
      border: 1px solid rgba(255, 50, 50, 0.2);
      padding: 8px 24px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-secondary);
      border-radius: 4px;
      margin-bottom: 2rem;
      box-shadow: var(--glow-red);
    }

    .hud .label { color: var(--text-muted); }
    .hud .value { color: var(--accent-primary); font-weight: 700; }
    .hud .separator { color: rgba(255, 50, 50, 0.2); }

    /* Big 404 */
    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      color: var(--accent-primary);
      text-shadow: 0 0 40px rgba(255, 51, 51, 0.4), 0 0 80px rgba(255, 51, 51, 0.2);
      line-height: 1;
      animation: glitch 3s infinite;
      position: relative;
    }

    .error-code::before,
    .error-code::after {
      content: "404";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.8;
    }

    .error-code::before {
      color: #0ff;
      animation: glitch-1 3s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }

    .error-code::after {
      color: #f0f;
      animation: glitch-2 3s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: none; }
      92.5% { transform: translate(-3px, 1px); }
      95% { transform: translate(3px, -1px); }
      97.5% { transform: translate(-2px, 0); }
    }

    @keyframes glitch-1 {
      0%, 90%, 100% { transform: none; }
      92.5% { transform: translate(6px, -2px); }
      95% { transform: translate(-4px, 1px); }
    }

    @keyframes glitch-2 {
      0%, 90%, 100% { transform: none; }
      93% { transform: translate(-5px, 2px); }
      95.5% { transform: translate(3px, -1px); }
    }

    /* Doomguy ASCII */
    .doomguy {
      font-size: 10px;
      line-height: 1;
      color: var(--accent-primary);
      white-space: pre;
      margin: 1.5rem 0;
      display: inline-block;
      text-align: center;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.4);
    }

    .message {
      font-size: 1.15rem;
      color: var(--text);
      margin: 0.75rem 0 1.5rem;
      line-height: 1.6;
    }

    .message .pt { color: var(--accent-tertiary); }
    .message .en { color: var(--text-muted); font-size: 0.95rem; }

    .home-link {
      display: inline-block;
      padding: 12px 32px;
      background: transparent;
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .home-link:hover {
      background: var(--accent-primary);
      color: var(--bg);
      box-shadow: var(--glow-red), 0 0 40px rgba(255, 51, 51, 0.2);
    }

    .home-link:active {
      background: var(--accent-primary-dim);
    }

    .sub-text {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Blood drip animation */
    .drip {
      position: fixed;
      top: -60px;
      width: 2px;
      background: var(--accent-primary);
      box-shadow: 0 0 6px rgba(255, 51, 51, 0.5);
      pointer-events: none;
      z-index: 50;
      animation: drip var(--dur) var(--delay) linear infinite;
    }

    @keyframes drip {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Blood drips -->
  <div class="drip" style="left:10%;--dur:3s;--delay:0s"></div>
  <div class="drip" style="left:25%;--dur:4s;--delay:1.5s"></div>
  <div class="drip" style="left:45%;--dur:3.5s;--delay:0.8s"></div>
  <div class="drip" style="left:70%;--dur:4.2s;--delay:2.1s"></div>
  <div class="drip" style="left:85%;--dur:3.2s;--delay:0.3s"></div>

  <div class="container">
    <!-- HUD status bar -->
    <div class="hud">
      <span class="label">STATUS</span>
      <span class="value">404</span>
      <span class="separator">|</span>
      <span class="label">HEALTH</span>
      <span class="value">0%</span>
      <span class="separator">|</span>
      <span class="label">ARMOR</span>
      <span class="value">0%</span>
    </div>

    <!-- Glitch 404 -->
    <div class="error-code">404</div>

    <!-- Doomguy face (bloody) -->
    <div class="doomguy">
   .---.  
  | RIP | 
  |     | 
  |O   O| 
  ||   || 
  | \\ // | 
  |  V  | 
  |-----| 
   \\ //   
    V V    
    </div>

    <p class="message">
      <span class="pt">Voc&ecirc; entrou no inferno errado.</span><br>
      <span class="en">You've entered the wrong hell.</span>
    </p>

    <a href="/" class="home-link">
      Return to the Living &mdash; Voltar ao Mundo dos Vivos
    </a>

    <p class="sub-text">
      Este n&atilde;o &eacute; o caminho que voc&ecirc; procura.<br>
      This is not the path you're looking for.
    </p>
  </div>
</body>
</html>
